{% extends "base.html" %}
{% block content %}
  <h1>Task Types List <a href="{% url 'tasks:task-type-create' %}" class="btn btn-primary">Create</a></h1>
  {% if task_types_list %}
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody>
      {% for type in task_types_list %}
        <tr>
          <td>{{ type.id }}</td>
          <td><a href="{% url 'tasks:task-type-detail' pk=type.id %}">{{ type.name }}</a></td>
          <td><a href="{% url 'tasks:task-type-update' pk=type.id %}">UPDATE</a></td>
          <td><a href="{% url 'tasks:task-type-delete' pk=type.id %}" style="color: red">DELETE</a></td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
    <p>There are no task types.</p>
  {% endif %}
{% endblock %}
