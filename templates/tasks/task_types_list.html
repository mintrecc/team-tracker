{% extends "base.html" %}
{% block content %}
  <h1>Task Types List</h1>
  {% if task_types_list %}
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
      </tr>
    </thead>
    <tbody>
      {% for type in task_types_list %}
        <tr>
          <td>{{ type.id }}</td>
          <td>{{ type.name }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
    <p>There are no task types.</p>
  {% endif %}
{% endblock %}
