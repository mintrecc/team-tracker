{% extends "base.html" %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2>Register new worker</h2>
      <form method="post" action="" novalidate>
        {% csrf_token %}
        
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">Register</button>
      </form>
      <p class="mt-3">
        Have account? <a href="{% url 'login' %}">Login</a>
      </p>
    </div>
  </div>
{% endblock %}
