{% extends "base.html" %}

{% block content %}
  <div class="row justify-content-center py-4">
    <div class="col-md-8 col-lg-5">

      <div class="card shadow-sm border-0">
        <div class="card-body p-4 text-center">

          <div class="mb-3">
            <span class="badge badge-pill badge-light border text-danger p-3" style="font-size: 1.5rem; line-height: 1;">
              &excl;
            </span>
          </div>

          <h2 class="h4 font-weight-bold text-dark mb-2">Delete Position?</h2>
          <p class="text-muted small mb-4">
            Are you sure you want to delete
            <strong class="text-dark">"{{ position.name }}"</strong>?
            This action cannot be undone.
          </p>

          <form action="" method="post">
            {% csrf_token %}

            <div class="d-flex justify-content-center align-items-center">
              <a href="{% url 'tasks:positions-list' %}" class="btn btn-outline-secondary btn-sm px-4 mr-2">
                Cancel
              </a>
              <button type="submit" class="btn btn-danger btn-sm px-4 shadow-sm">
                Confirm Delete
              </button>
            </div>
          </form>

        </div>
      </div>

    </div>
  </div>
{% endblock %}
