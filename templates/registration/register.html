{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div class="row justify-content-center py-4">
    <div class="col-md-8 col-lg-6">
      
      <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <h2 class="h3 font-weight-bold text-dark mb-1">Create an Account</h2>
            <p class="text-muted small">Register a new worker in Team Tracker</p>
          </div>

          <form method="post" action="" novalidate>
            {% csrf_token %}

            {{ form|crispy }}

            <button type="submit" class="btn btn-primary btn-block mt-4 py-2 font-weight-bold shadow-sm">
              Register Worker
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <p class="text-muted small mb-0">
              Already have an account?
              <a href="{% url 'login' %}" class="font-weight-medium text-decoration-none">
                Sign in
              </a>
            </p>
          </div>
        </div>
      </div>

    </div>
  </div>
{% endblock %}
